<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ed" />
    <meta
      name="description"
      content="悠悠的学习之旅：记录每一次发现，理解每一个为什么。"
    />
    <title>计算机 · 悠悠的学习之旅</title>
    <link rel="stylesheet" href="/learning/learning.css" />
    <script type="module" src="/learning/learning.js"></script>
  </head>
  <body data-subject="computing">
    <div class="page">
      <header class="topbar">
        <a class="wordmark" href="/learning/">✳ 悠悠的学习之旅</a
        ><a class="back" href="/">← 游戏大厅</a>
      </header>
      <main>
        <nav class="breadcrumb">
          <a href="/learning/">学习地图</a><span>/</span><span>计算机</span>
        </nav>
        <section class="subject-heading" style="--card: #c5dfef">
          <span class="subject-icon" aria-hidden="true">⌘</span>
          <div>
            <p class="eyebrow">逻辑 · 创造 · 编程</p>
            <h1>计算机小世界</h1>
            <p>把大问题拆小，让想法一步步运行。</p>
          </div>
        </section>
        <section class="empty-intro">
          <span aria-hidden="true">⌘</span>
          <div>
            <h2>这个世界，等你的第一份发现。</h2>
            <p>
              目前还没有计算机考试分析或专属练习。先记录考试与疑问，之后可根据真实题目添加复盘和巩固内容。
            </p>
          </div>
        </section>
        <section class="records-section">
          <div class="section-title">
            <div>
              <p class="eyebrow">MY LEARNING JOURNAL</p>
              <h2>我的考试记录</h2>
            </div>
            <div class="record-tools">
              <button type="button" id="export-records" class="quiet-button">
                导出本机记录 ↓</button
              ><label class="quiet-button import-label"
                >导入备份 ↑<input
                  id="import-records"
                  type="file"
                  accept="application/json,.json"
              /></label>
            </div>
          </div>
          <p class="storage-note">
            新增记录只保存在当前浏览器，不会上传或跨设备同步。它们是私人记录，不会自动出现在公开报告中。
          </p>
          <p id="storage-status" role="status" class="notice" hidden></p>
          <div id="import-preview" class="notice" hidden>
            <p id="import-summary"></p>
            <button id="confirm-import" type="button" class="quiet-button">
              确认合并记录
            </button>
            <button id="cancel-import" type="button" class="quiet-button">
              取消导入
            </button>
          </div>
          <p id="import-status" role="status"></p>
          <div id="record-list" class="record-list" aria-live="polite"></div>
          <details class="add-record" open>
            <summary>＋ 记录一次考试与发现</summary>
            <form id="record-form" novalidate>
              <div class="form-grid">
                <label
                  >考试名称<input
                    name="title"
                    required
                    maxlength="80"
                    placeholder="例如：第三单元小测"
                    autocomplete="off" /></label
                ><label
                  >考试日期<input name="date" type="date" required /></label
                ><label
                  >我的分数<input
                    name="score"
                    type="number"
                    min="0"
                    step="0.5"
                    inputmode="decimal"
                    required
                    placeholder="0" /></label
                ><label
                  >满分<input
                    name="total"
                    type="number"
                    min="1"
                    max="10000"
                    step="0.5"
                    inputmode="decimal"
                    required
                    value="100"
                /></label>
              </div>
              <label
                >这次的发现 / 下次想试的方法<textarea
                  name="reflection"
                  maxlength="1000"
                  rows="3"
                  placeholder="例如：我会算角度了，但需要先标出哪些角组成平角。"
                ></textarea>
              </label>
              <p id="form-status" role="status"></p>
              <button class="button" type="submit">
                保存这份发现 <span>✓</span>
              </button>
            </form>
          </details>
        </section>
      </main>
      <footer>
        一点点发现，一步步成长。<span>不和别人比，只看见自己的进步。</span>
      </footer>
    </div>
  </body>
</html>
